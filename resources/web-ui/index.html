<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JTDX Web UI</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <section id="cycle_strip" class="cycle-strip" aria-label="当前周期进度" data-testid="cycle-strip">
      <span id="cycle_label">周期</span>
      <div class="cycle-track"><span id="cycle_progress"></span></div>
      <span id="cycle_remaining">—</span>
    </section>
    <header class="hero"><span class="brand">JTDX</span><span id="connection" class="pill">未连接</span></header>
    <section class="workbench">
      <div class="workbench-left">
        <section class="card decode-card">
          <div class="section-heading"><h2>最近解码</h2><span id="decode_count">—</span></div>
          <div id="decodes" class="decodes"><p>等待数据…</p></div>
        </section>
      </div>
      <div class="workbench-right">
        <article class="card frequency-control">
          <h2>频率</h2>
          <div class="frequency-form">
            <label class="field" for="frequency_band">频段<select id="frequency_band"><option value="">全部频段</option></select></label>
            <label class="field" for="frequency_preset">常用频率<select id="frequency_preset"><option value="">选择常用频率</option></select></label>
            <label class="field" for="frequency_input">目标频率（Hz）<input id="frequency_input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="8"></label>
            <button id="frequency_send" type="button" disabled>应用</button>
          </div>
          <p id="frequency_result" class="frequency-result" aria-live="polite" hidden></p>
        </article>
        <article class="card radio-panel">
          <div class="section-heading"><h2>电台控制</h2><span id="radio_state_badge">—</span></div>
          <div class="radio-actions">
            <button id="radio_enable_tx" type="button" disabled>启用发射</button>
            <button id="radio_stop_tx" class="danger" type="button" disabled>终止发射</button>
            <button id="radio_log_qso" type="button" disabled>记录通联</button>
            <button id="radio_clear_windows" type="button" disabled>清空窗口</button>
            <button id="radio_sync" type="button" disabled>同步</button>
            <button id="radio_multi_decode" type="button" disabled>多次解码</button>
          </div>
          <p id="radio_result" class="frequency-result" aria-live="polite" hidden></p>
          <div id="radio_qso_draft" class="qso-draft" hidden>
            <div class="tx-editor-heading"><strong>记录通联草稿</strong></div>
            <div class="qso-grid">
              <label>呼号<input id="qso_call" type="text" maxlength="12" autocomplete="off"></label>
              <label>网格<input id="qso_grid" type="text" maxlength="10" autocomplete="off"></label>
              <label>模式<input id="qso_mode" type="text" maxlength="12" autocomplete="off"></label>
              <label>发送报告<input id="qso_report_sent" type="text" maxlength="8" autocomplete="off"></label>
              <label>接收报告<input id="qso_report_received" type="text" maxlength="8" autocomplete="off"></label>
              <label>姓名<input id="qso_name" type="text" maxlength="64" autocomplete="off"></label>
              <label>开始时间<input id="qso_start" type="text" maxlength="40" autocomplete="off"></label>
              <label>结束时间<input id="qso_end" type="text" maxlength="40" autocomplete="off"></label>
              <label>频率 Hz<input id="qso_frequency_hz" type="text" inputmode="numeric" maxlength="8" autocomplete="off"></label>
              <label>功率<input id="qso_tx_power" type="text" maxlength="16" autocomplete="off"></label>
              <label class="qso-wide">备注<input id="qso_comments" type="text" maxlength="256" autocomplete="off"></label>
              <label class="qso-wide">eQSL 备注<input id="qso_eqsl_comments" type="text" maxlength="256" autocomplete="off"></label>
            </div>
            <div class="button-row"><button id="radio_qso_cancel" type="button">取消草稿</button><button id="radio_qso_confirm" type="button">确认提交 QSO</button></div>
          </div>
        </article>
        <article class="card frequency-control">
          <h2>CQ / AutoSeq</h2>
          <div class="button-row"><button id="business_start_cq" type="button" disabled>启动 CQ</button><button id="business_start_auto" type="button" disabled>启用 AutoSeq</button><button id="business_stop" type="button" disabled>停止</button></div>
          <p id="business_result" class="frequency-result" aria-live="polite" hidden></p>
        </article>
        <article class="card radio-state-card">
          <h2>电台状态</h2>
          <dl>
            <dt>应用</dt><dd id="application_name">—</dd>
            <dt>模式 / 频段</dt><dd id="mode_band">—</dd>
            <dt>实例</dt><dd id="instance_id">—</dd>
            <dt>接收状态</dt><dd id="online">—</dd>
            <dt>解码中</dt><dd id="decoding">—</dd>
            <dt>DX 呼号</dt><dd id="dx_call"></dd>
            <dt>DX 网格</dt><dd id="dx_grid"></dd>
            <dt>报告</dt><dd id="report">—</dd>
            <dt>RX / TX DF</dt><dd id="df">—</dd>
            <dt>TX 模式</dt><dd id="tx_mode">—</dd>
            <dt>发射许可 / 状态</dt><dd id="tx_summary">—</dd>
            <dt>CQ / QSO</dt><dd id="cq_qso">—</dd>
            <dt>AutoSeq</dt><dd id="auto_sequence_state">—</dd>
          </dl>
          <p id="dx_selection_result" class="frequency-result" aria-live="polite" hidden></p>
        </article>
      </div>
    </section>
    <p id="demo_notice" class="notice" hidden>本地演示夹具：数据为模拟状态，不代表真实电台。</p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
