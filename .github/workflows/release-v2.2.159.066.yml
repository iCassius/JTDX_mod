name: Release v2.2.159.066 Windows x64

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-v2.2.159.066-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAMLIB_URL: https://github.com/Hamlib/Hamlib/releases/download/4.7.2/hamlib-w64-4.7.2.zip
      HAMLIB_SHA256: 8553bc6c5c6032e8debf99c017e98f58fed7e07e7c25d04815dc3e8bbe3304c7
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enforce main-only, unique release identity
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Dispatch this workflow from main.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:GITHUB_SHA) { throw "Checkout $head differs from dispatched SHA $env:GITHUB_SHA." }
          $tag = "v2.2.159.066-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release view $tag --json tagName 2>$null | Out-Null
          $releaseViewExitCode = $LASTEXITCODE
          if ($releaseViewExitCode -eq 0) { throw "Release $tag already exists; refusing to replace it." }
          gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
          $tagLookupExitCode = $LASTEXITCODE
          if ($tagLookupExitCode -eq 0) { throw "Tag $tag already exists; refusing to reuse it." }
          $LASTEXITCODE = 0
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Install MSYS2 MinGW64 build dependencies
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-qt5-multimedia
            mingw-w64-x86_64-qt5-serialport
            mingw-w64-x86_64-qt5-tools
            mingw-w64-x86_64-qt5-websockets

      - name: Fetch and verify official Hamlib 4.7.2 Windows x64 SDK
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $mingwPrefix = Join-Path $env:MSYS2_LOCATION 'mingw64'
          $mingwBin = Join-Path $mingwPrefix 'bin'
          foreach ($tool in @('gcc.exe', 'g++.exe', 'gfortran.exe', 'cmake.exe', 'ninja.exe', 'ctest.exe')) {
            $toolPath = Join-Path $mingwBin $tool
            if (!(Test-Path -LiteralPath $toolPath)) { throw "Expected MinGW64 tool is missing: $toolPath" }
          }
          $qtPlatformPlugins = $null
          $qmake = Join-Path $mingwBin 'qmake.exe'
          if (Test-Path -LiteralPath $qmake) {
            $qtPluginRoot = (& $qmake -query QT_INSTALL_PLUGINS 2>$null | Select-Object -Last 1)
            $qmakeExitCode = $LASTEXITCODE
            if ($qmakeExitCode -eq 0 -and $qtPluginRoot) { $qtPlatformPlugins = Join-Path $qtPluginRoot.Trim() 'platforms' }
          }
          if (!$qtPlatformPlugins -or !(Test-Path -LiteralPath (Join-Path $qtPlatformPlugins 'qwindows.dll'))) {
            $qwindows = Get-ChildItem -LiteralPath $mingwPrefix -Filter qwindows.dll -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
            if (!$qwindows) { throw "Could not locate Qt qwindows.dll under MinGW prefix $mingwPrefix." }
            $qtPlatformPlugins = $qwindows.DirectoryName
          }
          if (!(Test-Path -LiteralPath (Join-Path $qtPlatformPlugins 'qwindows.dll'))) { throw "Qt platform plugin qwindows.dll is missing from: $qtPlatformPlugins" }
          $LASTEXITCODE = 0
          $archive = Join-Path $env:RUNNER_TEMP 'hamlib-w64-4.7.2.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'hamlib-4.7.2'
          Invoke-WebRequest -Uri $env:HAMLIB_URL -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:HAMLIB_SHA256) { throw "Hamlib SHA-256 mismatch: $actual" }
          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          $header = @(Get-ChildItem -LiteralPath $extract -Filter rig.h -File -Recurse | Where-Object { $_.FullName -match '[\\/]include[\\/]hamlib[\\/]rig\.h$' })
          if ($header.Count -ne 1) { throw "Expected one include/hamlib/rig.h, found $($header.Count)." }
          $prefix = Split-Path (Split-Path $header[0].DirectoryName -Parent) -Parent
          $libDir = Join-Path $prefix 'lib'
          $binDir = Join-Path $prefix 'bin'
          if (!(Test-Path -LiteralPath $libDir) -or !(Test-Path -LiteralPath $binDir)) { throw 'Hamlib ZIP lacks the expected lib/bin layout.' }
          $imports = @(Get-ChildItem -LiteralPath $libDir -File -Recurse | Where-Object { $_.Name -match '(?i)hamlib.*\.dll\.a$' })
          if ($imports.Count -ne 1) { throw "Expected one Hamlib DLL import library, found $($imports.Count)." }
          $canonicalImport = Join-Path $libDir 'libhamlib.dll.a'
          if ($imports[0].FullName -ne $canonicalImport) { Copy-Item -LiteralPath $imports[0].FullName -Destination $canonicalImport -Force }
          if (!(Get-ChildItem -LiteralPath $binDir -Filter '*.dll' -File | Select-Object -First 1)) { throw 'Hamlib ZIP has no runtime DLLs in bin/.' }
          "HAMLIB_INCLUDE_DIR=$(Join-Path $prefix 'include')" >> $env:GITHUB_ENV
          "HAMLIB_IMPORT_LIBRARY=$canonicalImport" >> $env:GITHUB_ENV
          "HAMLIB_BIN_DIR=$binDir" >> $env:GITHUB_ENV
          "MINGW_BIN=$mingwBin" >> $env:GITHUB_ENV
          "MINGW_PREFIX=$mingwPrefix" >> $env:GITHUB_ENV
          "MINGW_CMAKE=$(Join-Path $mingwBin 'cmake.exe')" >> $env:GITHUB_ENV
          "MINGW_CTEST=$(Join-Path $mingwBin 'ctest.exe')" >> $env:GITHUB_ENV
          "QT_QPA_PLATFORM_PLUGIN_PATH=$qtPlatformPlugins" >> $env:GITHUB_ENV
          $binDir >> $env:GITHUB_PATH
          $mingwBin >> $env:GITHUB_PATH

      - name: Fetch the official LoTW user activity dataset
        run: |
          $csvPath = Join-Path $env:GITHUB_WORKSPACE 'lotw-user-activity.csv'
          Invoke-WebRequest -Uri 'https://lotw.arrl.org/lotw-user-activity.csv' -OutFile $csvPath
          $csvFile = Get-Item -LiteralPath $csvPath
          if ($csvFile.Length -lt 1000000) { throw "LoTW activity CSV is unexpectedly small ($($csvFile.Length) bytes)." }
          $firstLine = Get-Content -LiteralPath $csvPath -TotalCount 1
          $fields = $firstLine.Split(',')
          if ($fields.Count -ne 3 -or [string]::IsNullOrWhiteSpace($fields[0]) -or
              $fields[1] -notmatch '^\d{4}-\d{2}-\d{2}$' -or $fields[2] -notmatch '^\d{2}:\d{2}:\d{2}$') {
            throw "LoTW activity CSV does not have the expected callsign,date,time format: $firstLine"
          }
          $csvHash = (Get-FileHash -LiteralPath $csvPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "LOTW_DATA_SHA256=$csvHash" >> $env:GITHUB_ENV
          "Validated official LoTW dataset: $($csvFile.Length) bytes; SHA-256 $csvHash"

      - name: Configure MinGW64 Release with OmniRig disabled
        run: |
          $missing = @(
            'docs/CHANGELOG_P066_用户版_zh-CN.md',
            'docs/autoseq/P032_日志与起呼停滞收尾_zh-CN.md',
            'docs/autoseq/P033_CAT长挂机与首发射修复_zh-CN.md',
            'docs/autoseq/P034_CAT与PTT反馈指南_zh-CN.md',
            'docs/autoseq/P035_CAT与PTT反馈指南_zh-CN.md'
          ) | Where-Object { !(Test-Path -LiteralPath $_) }
          if ($missing.Count -gt 0) { throw "CMake install source docs are missing: $($missing -join ', ')" }
          $cCompiler = Join-Path $env:MINGW_BIN 'gcc.exe'
          $cxxCompiler = Join-Path $env:MINGW_BIN 'g++.exe'
          $fortranCompiler = Join-Path $env:MINGW_BIN 'gfortran.exe'
          foreach ($compiler in @($cCompiler, $cxxCompiler, $fortranCompiler)) {
            if (!(Test-Path -LiteralPath $compiler)) { throw "MinGW compiler is missing: $compiler" }
          }
          $cmake = Join-Path $env:MINGW_BIN 'cmake.exe'
          $ninja = Join-Path $env:MINGW_BIN 'ninja.exe'
          & $cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_MAKE_PROGRAM=$ninja" `
            "-DCMAKE_C_COMPILER=$cCompiler" `
            "-DCMAKE_CXX_COMPILER=$cxxCompiler" `
            "-DCMAKE_Fortran_COMPILER=$fortranCompiler" `
            "-DCMAKE_PREFIX_PATH=$env:MINGW_PREFIX" `
            -DHamlib_INCLUDE_DIR="$env:HAMLIB_INCLUDE_DIR" `
            -DHamlib_LIBRARY="$env:HAMLIB_IMPORT_LIBRARY" `
            -DJTDX_BUILD_LOCAL_TESTS=ON `
            -DWSJT_GENERATE_DOCS=OFF `
            -DWSJT_ENABLE_OMNIRIG=OFF

      - name: Build all targets
        run: '& $env:MINGW_CMAKE --build build --parallel 2'

      - name: Build focused tests excluded from the default target
        run: |
          & $env:MINGW_CMAKE --build build --target p0_qstandardpaths_preflight p0_mainwindow_integration_test --parallel 2

      - name: Run the full CTest suite
        run: |
          $env:PATH = "$env:MINGW_BIN;$env:HAMLIB_BIN_DIR;$env:PATH"
          if (!(Test-Path -LiteralPath $env:QT_QPA_PLATFORM_PLUGIN_PATH)) { throw "Qt platform plugins are missing: $env:QT_QPA_PLATFORM_PLUGIN_PATH" }
          & $env:MINGW_CTEST --test-dir build -C Release --output-on-failure

      - name: Install and package the Windows x64 ZIP
        run: |
          $env:PATH = "$env:MINGW_BIN;$env:HAMLIB_BIN_DIR;$env:PATH"
          if (!(Test-Path -LiteralPath $env:QT_QPA_PLATFORM_PLUGIN_PATH)) { throw "Qt platform plugins are missing: $env:QT_QPA_PLATFORM_PLUGIN_PATH" }
          $stage = Join-Path $env:RUNNER_TEMP 'jtdx-install'
          & $env:MINGW_CMAKE --install build --prefix $stage
          if (!(Test-Path -LiteralPath (Join-Path $stage 'bin/jtdx.exe'))) { throw 'Installed jtdx.exe is missing.' }
          foreach ($doc in @(
            'P032_日志与起呼停滞收尾_zh-CN.md',
            'P033_CAT长挂机与首发射修复_zh-CN.md',
            'P034_CAT与PTT反馈指南_zh-CN.md',
            'P035_CAT与PTT反馈指南_zh-CN.md'
          )) {
            if (!(Get-ChildItem -LiteralPath $stage -Filter $doc -File -Recurse | Select-Object -First 1)) { throw "Installed documentation is missing: $doc" }
          }
          $p035 = Get-ChildItem -LiteralPath $stage -Filter 'P035_CAT与PTT反馈指南_zh-CN.md' -File -Recurse | Select-Object -First 1
          if (!$p035) { throw 'Cannot locate the installed autoseq documentation directory.' }
          $docRoot = $p035.Directory.Parent.FullName
          Copy-Item -LiteralPath 'docs/CHANGELOG_P066_用户版_zh-CN.md' -Destination $docRoot
          if (!(Test-Path -LiteralPath (Join-Path $docRoot 'CHANGELOG_P066_用户版_zh-CN.md'))) { throw 'P066 changelog was not copied into the package.' }
          if (!(Get-ChildItem -LiteralPath (Join-Path $stage 'bin') -Filter '*hamlib*.dll' -File | Select-Object -First 1)) { throw 'Installed Hamlib runtime DLL is missing.' }
          $zip = Join-Path $env:RUNNER_TEMP 'JTDX-2.2.159.066-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          $checksum = "$zip.sha256"
          [System.IO.File]::WriteAllText($checksum, "$hash *$(Split-Path $zip -Leaf)`n", [System.Text.UTF8Encoding]::new($false))
          "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          "RELEASE_SHA256=$checksum" >> $env:GITHUB_ENV

      - name: Publish unsigned prerelease for this run attempt
        run: |
          $changeNotes = Get-Content -Raw -Encoding UTF8 'docs/CHANGELOG_P066_用户版_zh-CN.md'
          $notes = @(
            '# P066 — JTDX 2.2.159.066 Windows x64'
            $changeNotes
            ''
            '## Build and validation boundary'
            ''
            "- Hamlib 4.7.2 was downloaded from the upstream Windows x64 release ZIP and SHA-256 verified as $env:HAMLIB_SHA256; this upstream binary package differs from local P21."
            "- The embedded LoTW user activity CSV was fetched from the official ARRL endpoint during this run (SHA-256: $env:LOTW_DATA_SHA256)."
            '- This prerelease is unsigned and has no Authenticode signature.'
            '- Hardware-in-the-loop (HIL) validation was not run.'
            '- The license audit is incomplete.'
            '- Full Windows MinGW64 build, CTest, CMake install, ZIP packaging, and SHA-256 generation ran in this workflow.'
          ) -join "`n"
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesPath, $notes, [System.Text.UTF8Encoding]::new($false))
          gh release create $env:RELEASE_TAG $env:RELEASE_ZIP $env:RELEASE_SHA256 `
            --target $env:GITHUB_SHA `
            --title $env:RELEASE_TAG `
            --notes-file $notesPath `
            --prerelease
